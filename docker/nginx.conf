# Nginx-Konfiguration fuer das BaitBuddy-Frontend.
# Entspricht rewrites + headers aus vercel.json; /api wird zum Backend geproxyt.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads (Fangfotos als Base64 im JSON-Body) und SSE-Streams des KI-Buddys
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # API -> Express-Backend (Container "backend")
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE (POST /api/ai/chat/stream): kein Buffering, lange Timeouts
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://backend:3000/health;
    }

    # Service Worker darf nie gecacht werden
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.json {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Gehashte Vite-Assets: unbegrenzt cachen
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # SPA-Fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
