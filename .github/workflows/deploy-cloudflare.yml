name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Test Cloudflare API routing
        run: npm test -- cloudflare/worker.test.js

      - name: Build frontend
        run: npm run build

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment and fish-recipes API
        run: |
          set -euo pipefail
          healthy=0
          for i in {1..30}; do
            code=$(curl --silent --show-error --max-time 10 -o /tmp/baitbuddy-health.json -w '%{http_code}' https://catchgbt.com/api/health || true)
            if [ "$code" = "200" ] && node -e 'const s=JSON.parse(require("fs").readFileSync("/tmp/baitbuddy-health.json","utf8")); if(s.ok!==true || s.app!=="BaitBuddy")process.exit(1)' ; then
              echo "Current backend health check passed"
              healthy=1
              break
            fi
            echo "Attempt $i/30: current backend not healthy (HTTP $code)"
            sleep 2
          done
          if [ "$healthy" != "1" ]; then
            echo "FAIL: current backend health check did not pass"
            exit 1
          fi
          # No credentials: the protected route MUST return HTTP 401 from
          # requireAuth. An obsolete backend returns 404 instead.
          recipe_code=$(curl --silent --show-error --max-time 15 -o /tmp/baitbuddy-recipes.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"species":"Hecht"}' https://catchgbt.com/api/ai/fish-recipes)
          if [ "$recipe_code" != "401" ]; then
            echo "FAIL: fish-recipes API expected unauthenticated 401, got HTTP $recipe_code"
            exit 1
          fi
          echo "Fish-recipes route is deployed and protected by authentication"
