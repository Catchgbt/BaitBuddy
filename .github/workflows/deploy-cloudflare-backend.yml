name: Deploy Backend to Cloudflare

# Parallelbetrieb: Jeder Push nach main deployed das bestehende Express-Backend
# auch als Cloudflare Container (Worker baitbuddy-api). Vercel bleibt bestehen.
# Der Front-Door-Worker routet erst dann zum Container, wenn BACKEND_URL
# ausdruecklich umgestellt wird. Dieses Workflow aendert kein Live-Routing.
#
# Voraussetzungen: Workers Paid Plan (Containers), GitHub Action Secrets
# CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID sowie benoetigte Secrets
# am Worker baitbuddy-api (cloudflare/backend/containerEnv.js).

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-cloudflare-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      HEALTH_URL: ${{ vars.CLOUDFLARE_BACKEND_URL || 'https://baitbuddy-api.kaisaschnitt99.workers.dev' }}/api/health

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Cloudflare deployment credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Cloudflare deployment requires GitHub secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # @cloudflare/containers wird für das Worker-Bundle gebraucht.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test Cloudflare backend environment
        run: npm test -- cloudflare/backend/containerEnv.test.js

      # Baut docker/backend.Dockerfile (Docker ist auf ubuntu-latest vorhanden),
      # pusht das Image in die Cloudflare-Registry und rollt den Container aus.
      - name: Deploy Worker + Container
        run: npx wrangler deploy --config cloudflare/backend/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Der erste Deploy kann einige Minuten brauchen, bis das Image bereitsteht.
      - name: Verify backend health
        run: |
          for i in $(seq 1 40); do
            body=$(curl -s --max-time 20 "$HEALTH_URL" || true)
            if echo "$body" | grep -q '"ok":true'; then
              echo "Backend antwortet: $body"
              exit 0
            fi
            echo "Versuch $i/40: noch keine Antwort ($body)"
            sleep 15
          done
          echo "Backend-Container antwortet nicht unter $HEALTH_URL"
          exit 1
