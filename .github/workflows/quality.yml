name: Quality Gate

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Clean npm cache
        run: npm cache clean --force
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install deps
        run: npm install --legacy-peer-deps --no-audit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install backend deps
        run: cd backend && npm install --legacy-peer-deps --no-audit
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify dependencies
        run: |
          echo "Root node_modules check:"
          test -d node_modules && echo "✓ Root node_modules exists" || echo "✗ Root node_modules missing"
          echo "Backend node_modules check:"
          test -d backend/node_modules && echo "✓ Backend node_modules exists" || echo "✗ Backend node_modules missing"
          echo "Checking critical dependencies:"
          ls -la node_modules/express-async-errors/package.json 2>/dev/null || echo "✗ express-async-errors not found"

      - name: Lint
        run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Typecheck
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Unit tests
        run: npm run test
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build
        run: npm run build
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  e2e:
    runs-on: ubuntu-latest
    # Der Route-Crawl ist neu (Phase 1 des Bug-Testing-Durchgangs) und laeuft
    # separat vom blockierenden Gate, bis er sich als stabil erwiesen hat.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke crawl
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
