<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Hintergrund: Gradient Emerald zu Cyan -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bgGradient)"/>

  <!-- Fisch: Körper (vereinfacht, stilisiert) -->
  <ellipse cx="256" cy="280" rx="90" ry="60" fill="#ffffff" opacity="0.95"/>

  <!-- Fisch: Schwanz -->
  <path d="M 160 280 Q 120 240 80 200 Q 110 280 80 360 Q 120 320 160 280" fill="#ffffff" opacity="0.95"/>

  <!-- Fisch: Auge -->
  <circle cx="310" cy="260" r="12" fill="#0a0f1a"/>
  <circle cx="312" cy="258" r="5" fill="#ffffff"/>

  <!-- Fisch: Flosse oben -->
  <path d="M 240 220 Q 260 180 280 220 Q 260 210 240 220" fill="#ffffff" opacity="0.8"/>

  <!-- Fisch: Flosse unten -->
  <path d="M 240 340 Q 260 380 280 340 Q 260 350 240 340" fill="#ffffff" opacity="0.8"/>

  <!-- Angel-Hook: Angelschnur (oben rechts) -->
  <line x1="360" y1="80" x2="360" y2="200" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  <!-- Angel-Hook: Haken -->
  <path d="M 360 200 Q 380 220 360 240 Q 340 245 340 235" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Welle/Wasser-Effekt unten -->
  <path d="M 0 420 Q 64 400 128 420 T 256 420 T 384 420 T 512 420 L 512 512 L 0 512" fill="#ffffff" opacity="0.15"/>
</svg>
