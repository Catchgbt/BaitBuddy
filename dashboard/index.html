<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Command Center — Dashboard</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-2: #f0f3f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --shadow: 0 1px 3px rgba(15, 23, 42, .08), 0 8px 24px rgba(15, 23, 42, .05);
      --radius: 16px;
      --c1: #4f46e5; --c2: #0ea5e9; --c3: #16a34a; --c4: #d97706; --c5: #db2777; --c6: #7c3aed;
    }
    :root[data-theme="dark"] {
      --bg: #0b1120;
      --surface: #121a2b;
      --surface-2: #1a2438;
      --border: #24304a;
      --text: #e8edf7;
      --text-muted: #94a3b8;
      --primary: #818cf8;
      --primary-soft: #1e2540;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #f87171;
      --shadow: 0 1px 3px rgba(0, 0, 0, .4), 0 12px 30px rgba(0, 0, 0, .35);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1120; --surface: #121a2b; --surface-2: #1a2438; --border: #24304a;
        --text: #e8edf7; --text-muted: #94a3b8; --primary: #818cf8; --primary-soft: #1e2540;
        --success: #22c55e; --warning: #f59e0b; --danger: #f87171;
        --shadow: 0 1px 3px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.35);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, textarea, select {
      font-family: inherit; font-size: 14px; color: var(--text);
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 12px; width: 100%; outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--primary); }
    textarea { resize: vertical; }
    ::placeholder { color: var(--text-muted); }
    a { color: var(--primary); text-decoration: none; }

    .app { max-width: 1240px; margin: 0 auto; padding: 20px; }

    /* Header */
    header.topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; margin-bottom: 22px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .logo {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, var(--c1), var(--c2));
      display: grid; place-items: center; color: #fff; flex-shrink: 0;
    }
    .brand h1 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
    .brand .sub { font-size: 13px; color: var(--text-muted); }
    .clock { text-align: right; }
    .clock .time { font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .clock .date { font-size: 13px; color: var(--text-muted); text-transform: capitalize; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center;
      background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
      transition: .15s;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--primary); }

    /* Cards / grid */
    .grid { display: grid; gap: 18px; }
    .cols-2 { grid-template-columns: 1fr 1fr; }
    .cols-3 { grid-template-columns: repeat(3, 1fr); }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px;
    }
    .card h2 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .card h2 .count { margin-left: auto; font-size: 12px; color: var(--text-muted); font-weight: 500; }

    /* Stat tiles */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
    .stat {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden;
    }
    .stat .label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .stat .value { font-size: 30px; font-weight: 800; letter-spacing: -.03em; margin-top: 4px; }
    .stat .ic { position: absolute; top: 14px; right: 14px; opacity: .25; }

    /* AI links */
    .ai-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .ai-link {
      display: flex; align-items: center; gap: 10px; padding: 12px;
      border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2);
      transition: .15s; color: var(--text);
    }
    .ai-link:hover { transform: translateY(-2px); border-color: var(--primary); box-shadow: var(--shadow); }
    .ai-link .badge { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; flex-shrink: 0; }
    .ai-link .nm { font-size: 14px; font-weight: 600; }
    .ai-link .ds { font-size: 11px; color: var(--text-muted); }

    /* Lists */
    .row {
      display: flex; align-items: flex-start; gap: 10px; padding: 10px;
      border-radius: 11px; border: 1px solid transparent; transition: .12s;
    }
    .row:hover { background: var(--surface-2); }
    .row + .row { margin-top: 2px; }
    .check {
      width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border);
      flex-shrink: 0; margin-top: 1px; display: grid; place-items: center; transition: .12s;
    }
    .check:hover { border-color: var(--primary); }
    .check.done { background: var(--success); border-color: var(--success); color: #fff; }
    .task-main { flex: 1; min-width: 0; }
    .task-title { font-size: 14px; font-weight: 500; word-break: break-word; }
    .task-title.done { text-decoration: line-through; color: var(--text-muted); }
    .task-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; font-size: 11px; color: var(--text-muted); }
    .tag { padding: 2px 8px; border-radius: 999px; font-weight: 600; font-size: 11px; display: inline-flex; align-items: center; gap: 4px; }
    .due { display: inline-flex; align-items: center; gap: 4px; }
    .due.overdue { color: var(--danger); font-weight: 700; }
    .due.soon { color: var(--warning); font-weight: 600; }
    .prio-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .del {
      opacity: 0; color: var(--text-muted); padding: 4px; border-radius: 7px; transition: .12s; flex-shrink: 0;
    }
    .row:hover .del { opacity: 1; }
    .del:hover { color: var(--danger); background: var(--surface); }

    /* Add forms */
    .add-form { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .add-form .grow { flex: 1; min-width: 140px; }
    .btn {
      background: var(--primary); color: #fff; border-radius: 10px; padding: 9px 16px;
      font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: .15s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn.ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn.sm { padding: 6px 11px; font-size: 13px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    /* Projects */
    .proj { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 11px; transition: .12s; }
    .proj:hover { background: var(--surface-2); }
    .proj .swatch { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
    .proj .pn { flex: 1; font-size: 14px; font-weight: 500; }
    .proj .bar { height: 6px; border-radius: 999px; background: var(--surface-2); width: 90px; overflow: hidden; flex-shrink: 0; }
    .proj .bar > span { display: block; height: 100%; border-radius: 999px; }
    .proj .pct { font-size: 11px; color: var(--text-muted); width: 34px; text-align: right; font-variant-numeric: tabular-nums; }

    /* Notes */
    .note-editor textarea { min-height: 210px; font-size: 14px; line-height: 1.6; }
    .note-status { font-size: 11px; color: var(--text-muted); margin-top: 8px; display: flex; align-items: center; gap: 6px; }

    /* Charts */
    .chart-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .legend { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
    .legend .li { display: flex; align-items: center; gap: 8px; }
    .legend .dot { width: 11px; height: 11px; border-radius: 3px; flex-shrink: 0; }
    .legend .lv { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
    .empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 22px 8px; }

    /* Modal */
    .modal-back {
      position: fixed; inset: 0; background: rgba(2, 6, 23, .55); backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
    }
    .modal-back.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); width: 100%; max-width: 440px; padding: 22px; }
    .modal h3 { font-size: 17px; margin-bottom: 16px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
    .swatches { display: flex; gap: 8px; }
    .swatches button { width: 28px; height: 28px; border-radius: 8px; border: 2px solid transparent; }
    .swatches button.sel { border-color: var(--text); }

    .toast {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(120%);
      background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 11px;
      font-size: 13px; font-weight: 600; box-shadow: var(--shadow); z-index: 60; transition: transform .3s ease;
      max-width: 90vw;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin: 6px 0 10px; }
    .muted { color: var(--text-muted); }
    .scroll { max-height: 340px; overflow-y: auto; margin: -4px; padding: 4px; }
    .scroll::-webkit-scrollbar { width: 8px; }
    .scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

    @media (max-width: 900px) {
      .cols-2, .cols-3 { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
      .ai-links { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        </div>
        <div>
          <h1>Command Center</h1>
          <div class="sub" id="greeting">Dein persönliches Dashboard</div>
        </div>
      </div>
      <div class="clock">
        <div class="time" id="clockTime">--:--</div>
        <div class="date" id="clockDate">—</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="notifyBtn" title="Erinnerungen aktivieren">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        </button>
        <button class="icon-btn" id="exportBtn" title="Daten exportieren">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="icon-btn" id="importBtn" title="Daten importieren">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <input type="file" id="importFile" accept="application/json" hidden />
        <button class="icon-btn" id="themeBtn" title="Design wechseln">
          <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>
        </button>
      </div>
    </header>

    <!-- Stat tiles -->
    <div class="stats" id="stats"></div>

    <div class="grid cols-3">
      <!-- Left column: Tasks -->
      <div style="grid-column: span 2; display: flex; flex-direction: column; gap: 18px;">
        <div class="card">
          <h2>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            Aufgaben &amp; Erinnerungen
            <span class="count" id="taskCount"></span>
          </h2>
          <div class="add-form">
            <input class="grow" id="taskInput" placeholder="Neue Aufgabe … (Enter)" />
            <select id="taskProject" style="width: auto; min-width: 120px;"></select>
            <select id="taskPrio" style="width: auto;">
              <option value="low">Niedrig</option>
              <option value="med" selected>Mittel</option>
              <option value="high">Hoch</option>
            </select>
            <input type="datetime-local" id="taskDue" style="width: auto;" />
            <button class="btn" id="addTaskBtn">Hinzufügen</button>
          </div>
          <div class="scroll" id="taskList"></div>
        </div>

        <div class="grid cols-2">
          <!-- Chart: status donut -->
          <div class="card">
            <h2>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.2 15.9A10 10 0 1 1 8 2.8"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
              Status-Übersicht
            </h2>
            <div class="chart-wrap">
              <div id="donut"></div>
              <div class="legend" id="donutLegend"></div>
            </div>
          </div>
          <!-- Chart: 7-day trend -->
          <div class="card">
            <h2>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg>
              Erledigt (7 Tage)
            </h2>
            <div id="trend"></div>
          </div>
        </div>
      </div>

      <!-- Right column -->
      <div style="display: flex; flex-direction: column; gap: 18px;">
        <!-- AI Links -->
        <div class="card">
          <h2>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v1a3 3 0 0 0-3 3 3 3 0 0 0 0 6 3 3 0 0 0 3 3v1a3 3 0 0 0 6 0v-1a3 3 0 0 0 3-3 3 3 0 0 0 0-6 3 3 0 0 0-3-3V5a3 3 0 0 0-3-3z"/></svg>
            KI-Assistenten
          </h2>
          <div class="ai-links" id="aiLinks"></div>
        </div>

        <!-- Projects -->
        <div class="card">
          <h2>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            Projekte
            <button class="btn sm" id="addProjectBtn" style="margin-left: auto;">+ Neu</button>
          </h2>
          <div id="projectList"></div>
        </div>

        <!-- Notes -->
        <div class="card">
          <h2>
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
            Notizbuch
          </h2>
          <div class="note-editor">
            <textarea id="notes" placeholder="Notizen, Ideen, Gedanken … wird automatisch gespeichert."></textarea>
            <div class="note-status">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              <span id="noteStatus">Automatisch gespeichert</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer style="text-align: center; color: var(--text-muted); font-size: 12px; margin: 28px 0 8px;">
      Alle Daten bleiben lokal in deinem Browser (localStorage). Nutze Export für ein Backup.
    </footer>
  </div>

  <!-- Project modal -->
  <div class="modal-back" id="projectModal">
    <div class="modal">
      <h3 id="projectModalTitle">Neues Projekt</h3>
      <div class="field">
        <label>Name</label>
        <input id="projectNameInput" placeholder="z. B. Website Relaunch" />
      </div>
      <div class="field">
        <label>Farbe</label>
        <div class="swatches" id="colorSwatches"></div>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="projectCancel">Abbrechen</button>
        <button class="btn" id="projectSave">Speichern</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (function () {
    "use strict";

    // ---------- State ----------
    const STORE_KEY = "command_center_v1";
    const PALETTE = ["#4f46e5", "#0ea5e9", "#16a34a", "#d97706", "#db2777", "#7c3aed", "#0891b2", "#dc2626"];
    const AI_TOOLS = [
      { name: "ChatGPT", desc: "OpenAI GPT", url: "https://chat.openai.com", color: "#10a37f", initials: "GP" },
      { name: "Claude", desc: "Anthropic", url: "https://claude.ai", color: "#d97757", initials: "CL" },
      { name: "Gemini", desc: "Google", url: "https://gemini.google.com", color: "#1a73e8", initials: "GE" },
      { name: "Perplexity", desc: "Suche & KI", url: "https://www.perplexity.ai", color: "#20808d", initials: "PX" },
      { name: "Copilot", desc: "Microsoft", url: "https://copilot.microsoft.com", color: "#0a58ca", initials: "CP" },
      { name: "Mistral", desc: "Le Chat", url: "https://chat.mistral.ai", color: "#f2542d", initials: "MI" }
    ];

    const defaultState = () => ({
      tasks: [],
      projects: [
        { id: uid(), name: "Allgemein", color: "#4f46e5" }
      ],
      notes: "",
      history: {}, // { "YYYY-MM-DD": completedCount }
      theme: null
    });

    let state = load();
    let editingProjectId = null;
    let pickedColor = PALETTE[0];

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

    function load() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return defaultState();
        const parsed = JSON.parse(raw);
        const base = defaultState();
        return Object.assign(base, parsed, {
          projects: (parsed.projects && parsed.projects.length) ? parsed.projects : base.projects
        });
      } catch (e) {
        return defaultState();
      }
    }
    function save() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
      catch (e) { toast("Speichern fehlgeschlagen (Speicher voll?)"); }
    }

    // ---------- Helpers ----------
    const $ = (id) => document.getElementById(id);
    function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
    function todayKey(d) { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
    function projectById(id) { return state.projects.find(p => p.id === id); }

    let toastTimer;
    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
    }

    // ---------- Clock & greeting ----------
    function tickClock() {
      const now = new Date();
      $("clockTime").textContent = now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
      $("clockDate").textContent = now.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      const h = now.getHours();
      const greet = h < 5 ? "Gute Nacht" : h < 11 ? "Guten Morgen" : h < 18 ? "Guten Tag" : "Guten Abend";
      $("greeting").textContent = greet + " — bereit für den Tag?";
    }

    // ---------- Render: stats ----------
    function renderStats() {
      const open = state.tasks.filter(t => !t.done);
      const doneToday = state.history[todayKey()] || 0;
      const overdue = open.filter(t => t.due && new Date(t.due) < new Date()).length;
      const tiles = [
        { label: "Offen", value: open.length, color: "var(--primary)", icon: '<path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="10"/>' },
        { label: "Heute erledigt", value: doneToday, color: "var(--success)", icon: '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>' },
        { label: "Überfällig", value: overdue, color: "var(--danger)", icon: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>' },
        { label: "Projekte", value: state.projects.length, color: "var(--warning)", icon: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>' }
      ];
      $("stats").innerHTML = tiles.map(t => `
        <div class="stat">
          <div class="label">${t.label}</div>
          <div class="value" style="color:${t.color}">${t.value}</div>
          <svg class="ic" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${t.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${t.icon}</svg>
        </div>`).join("");
    }

    // ---------- Render: AI links ----------
    function renderAiLinks() {
      $("aiLinks").innerHTML = AI_TOOLS.map(a => `
        <a class="ai-link" href="${a.url}" target="_blank" rel="noopener noreferrer">
          <span class="badge" style="background:${a.color}">${a.initials}</span>
          <span><span class="nm">${a.name}</span><br><span class="ds">${a.desc}</span></span>
        </a>`).join("");
    }

    // ---------- Render: projects ----------
    function renderProjects() {
      const list = $("projectList");
      if (!state.projects.length) { list.innerHTML = '<div class="empty">Noch keine Projekte.</div>'; }
      else {
        list.innerHTML = state.projects.map(p => {
          const tasks = state.tasks.filter(t => t.projectId === p.id);
          const done = tasks.filter(t => t.done).length;
          const pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
          return `
          <div class="proj" data-id="${p.id}">
            <span class="swatch" style="background:${p.color}"></span>
            <span class="pn">${esc(p.name)}</span>
            <span class="bar"><span style="width:${pct}%;background:${p.color}"></span></span>
            <span class="pct">${pct}%</span>
            <button class="del proj-del" title="Projekt löschen" data-id="${p.id}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>`;
        }).join("");
      }
      // project select for task form
      const sel = $("taskProject");
      const prev = sel.value;
      sel.innerHTML = state.projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
      if (prev && projectById(prev)) sel.value = prev;
    }

    // ---------- Render: tasks ----------
    function prioColor(p) { return p === "high" ? "var(--danger)" : p === "med" ? "var(--warning)" : "var(--text-muted)"; }
    function prioLabel(p) { return p === "high" ? "Hoch" : p === "med" ? "Mittel" : "Niedrig"; }

    function dueInfo(due) {
      if (!due) return null;
      const d = new Date(due), now = new Date();
      const diff = d - now;
      const label = d.toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
      let cls = "";
      if (diff < 0) cls = "overdue";
      else if (diff < 3600000 * 12) cls = "soon";
      return { label, cls };
    }

    function renderTasks() {
      const list = $("taskList");
      const sorted = state.tasks.slice().sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        const ad = a.due ? new Date(a.due).getTime() : Infinity;
        const bd = b.due ? new Date(b.due).getTime() : Infinity;
        if (ad !== bd) return ad - bd;
        return b.createdAt - a.createdAt;
      });
      const open = state.tasks.filter(t => !t.done).length;
      $("taskCount").textContent = open + " offen / " + state.tasks.length + " gesamt";

      if (!sorted.length) { list.innerHTML = '<div class="empty">Keine Aufgaben — leg direkt eine an.</div>'; return; }

      list.innerHTML = sorted.map(t => {
        const proj = projectById(t.projectId);
        const di = dueInfo(t.due);
        return `
        <div class="row" data-id="${t.id}">
          <div class="check ${t.done ? "done" : ""}" data-check="${t.id}">
            ${t.done ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : ""}
          </div>
          <div class="task-main">
            <div class="task-title ${t.done ? "done" : ""}">${esc(t.title)}</div>
            <div class="task-meta">
              <span class="prio-dot" style="background:${prioColor(t.prio)}"></span>${prioLabel(t.prio)}
              ${proj ? `<span class="tag" style="background:${proj.color}22;color:${proj.color}">${esc(proj.name)}</span>` : ""}
              ${di ? `<span class="due ${di.cls}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${di.label}</span>` : ""}
            </div>
          </div>
          <button class="del task-del" title="Löschen" data-id="${t.id}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>`;
      }).join("");
    }

    // ---------- Charts (pure SVG) ----------
    function renderDonut() {
      const open = state.tasks.filter(t => !t.done);
      const overdue = open.filter(t => t.due && new Date(t.due) < new Date()).length;
      const onTrack = open.length - overdue;
      const done = state.tasks.filter(t => t.done).length;
      const parts = [
        { label: "Erledigt", value: done, color: "var(--c3)" },
        { label: "Im Plan", value: onTrack, color: "var(--c1)" },
        { label: "Überfällig", value: overdue, color: "#dc2626" }
      ];
      const total = parts.reduce((s, p) => s + p.value, 0);
      const R = 52, C = 2 * Math.PI * R, cx = 66, cy = 66;
      let offset = 0, segs = "";
      if (total > 0) {
        parts.forEach(p => {
          if (p.value === 0) return;
          const len = p.value / total * C;
          segs += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${p.color}" stroke-width="16"
            stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="butt"/>`;
          offset += len;
        });
      } else {
        segs = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="16"/>`;
      }
      $("donut").innerHTML = `
        <svg width="132" height="132" viewBox="0 0 132 132">
          ${segs}
          <text x="${cx}" y="${cy - 3}" text-anchor="middle" font-size="26" font-weight="800" fill="var(--text)">${total}</text>
          <text x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="11" fill="var(--text-muted)">Aufgaben</text>
        </svg>`;
      $("donutLegend").innerHTML = parts.map(p => `
        <div class="li"><span class="dot" style="background:${p.color}"></span>${p.label}<span class="lv">${p.value}</span></div>`).join("");
    }

    function renderTrend() {
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        days.push({ key: todayKey(d), label: d.toLocaleDateString("de-DE", { weekday: "short" }), value: state.history[todayKey(d)] || 0 });
      }
      const max = Math.max(1, ...days.map(d => d.value));
      const W = 300, H = 130, padX = 14, padB = 22, padT = 10;
      const iw = W - padX * 2, ih = H - padB - padT;
      const pts = days.map((d, i) => {
        const x = padX + (days.length === 1 ? iw / 2 : i / (days.length - 1) * iw);
        const y = padT + ih - (d.value / max) * ih;
        return { x, y, d };
      });
      const line = pts.map((p, i) => (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1)).join(" ");
      const area = line + ` L${pts[pts.length - 1].x.toFixed(1)} ${(padT + ih).toFixed(1)} L${pts[0].x.toFixed(1)} ${(padT + ih).toFixed(1)} Z`;
      $("trend").innerHTML = `
        <svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
          <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="var(--primary)" stop-opacity="0"/>
          </linearGradient></defs>
          <path d="${area}" fill="url(#tg)"/>
          <path d="${line}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          ${pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="var(--surface)" stroke="var(--primary)" stroke-width="2"/>
            <text x="${p.x.toFixed(1)}" y="${(p.y - 8).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text)">${p.d.value || ""}</text>
            <text x="${p.x.toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--text-muted)">${p.d.label}</text>`).join("")}
        </svg>`;
    }

    function renderAll() {
      renderStats(); renderProjects(); renderTasks(); renderDonut(); renderTrend();
    }

    // ---------- Task actions ----------
    function addTask() {
      const input = $("taskInput");
      const title = input.value.trim();
      if (!title) { input.focus(); return; }
      const due = $("taskDue").value ? new Date($("taskDue").value).toISOString() : null;
      state.tasks.push({
        id: uid(), title, done: false,
        projectId: $("taskProject").value || (state.projects[0] && state.projects[0].id),
        prio: $("taskPrio").value, due, notified: false, createdAt: Date.now()
      });
      input.value = ""; $("taskDue").value = "";
      save(); renderAll(); input.focus();
      if (due) toast("Aufgabe mit Erinnerung angelegt");
    }

    function toggleTask(id) {
      const t = state.tasks.find(x => x.id === id);
      if (!t) return;
      t.done = !t.done;
      if (t.done) {
        const k = todayKey();
        state.history[k] = (state.history[k] || 0) + 1;
      } else {
        const k = todayKey();
        if (state.history[k]) state.history[k] = Math.max(0, state.history[k] - 1);
      }
      save(); renderAll();
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter(t => t.id !== id);
      save(); renderAll();
    }

    // ---------- Project actions ----------
    function openProjectModal(id) {
      editingProjectId = id || null;
      const modal = $("projectModal");
      const p = id ? projectById(id) : null;
      $("projectModalTitle").textContent = id ? "Projekt bearbeiten" : "Neues Projekt";
      $("projectNameInput").value = p ? p.name : "";
      pickedColor = p ? p.color : PALETTE[state.projects.length % PALETTE.length];
      $("colorSwatches").innerHTML = PALETTE.map(c =>
        `<button data-c="${c}" class="${c === pickedColor ? "sel" : ""}" style="background:${c}"></button>`).join("");
      modal.classList.add("open");
      setTimeout(() => $("projectNameInput").focus(), 50);
    }
    function closeProjectModal() { $("projectModal").classList.remove("open"); editingProjectId = null; }
    function saveProject() {
      const name = $("projectNameInput").value.trim();
      if (!name) { $("projectNameInput").focus(); return; }
      if (editingProjectId) {
        const p = projectById(editingProjectId);
        if (p) { p.name = name; p.color = pickedColor; }
      } else {
        state.projects.push({ id: uid(), name, color: pickedColor });
      }
      save(); renderAll(); closeProjectModal();
    }
    function deleteProject(id) {
      if (state.projects.length <= 1) { toast("Mindestens ein Projekt muss bleiben"); return; }
      const tasks = state.tasks.filter(t => t.projectId === id).length;
      if (tasks && !confirm(`Projekt löschen? ${tasks} Aufgabe(n) werden mitgelöscht.`)) return;
      state.projects = state.projects.filter(p => p.id !== id);
      state.tasks = state.tasks.filter(t => t.projectId !== id);
      save(); renderAll();
    }

    // ---------- Notes (debounced autosave) ----------
    let noteTimer;
    function onNoteInput() {
      $("noteStatus").textContent = "Speichere …";
      clearTimeout(noteTimer);
      noteTimer = setTimeout(() => {
        state.notes = $("notes").value;
        save();
        $("noteStatus").textContent = "Automatisch gespeichert · " + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
      }, 500);
    }

    // ---------- Reminders ----------
    function requestNotify() {
      if (!("Notification" in window)) { toast("Benachrichtigungen werden nicht unterstützt"); return; }
      if (Notification.permission === "granted") { toast("Erinnerungen sind aktiv"); return; }
      Notification.requestPermission().then(perm => {
        toast(perm === "granted" ? "Erinnerungen aktiviert" : "Erinnerungen abgelehnt");
      });
    }
    function checkReminders() {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      const now = Date.now();
      let changed = false;
      state.tasks.forEach(t => {
        if (t.done || t.notified || !t.due) return;
        const due = new Date(t.due).getTime();
        if (due <= now) {
          const proj = projectById(t.projectId);
          try {
            new Notification("Aufgabe fällig: " + t.title, {
              body: (proj ? proj.name + " · " : "") + "Priorität " + prioLabel(t.prio),
              tag: "cc-" + t.id
            });
          } catch (e) { /* ignore */ }
          t.notified = true; changed = true;
        }
      });
      if (changed) save();
    }

    // ---------- Import / Export ----------
    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "command-center-backup-" + todayKey() + ".json";
      a.click(); URL.revokeObjectURL(url);
      toast("Backup exportiert");
    }
    function importData(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data || typeof data !== "object") throw new Error("bad");
          state = Object.assign(defaultState(), data);
          if (!state.projects.length) state.projects = defaultState().projects;
          save();
          $("notes").value = state.notes || "";
          applyTheme();
          renderAll();
          toast("Daten importiert");
        } catch (e) { toast("Import fehlgeschlagen — ungültige Datei"); }
      };
      reader.readAsText(file);
    }

    // ---------- Theme ----------
    function applyTheme() {
      const root = document.documentElement;
      if (state.theme === "dark") root.setAttribute("data-theme", "dark");
      else if (state.theme === "light") root.setAttribute("data-theme", "light");
      else root.removeAttribute("data-theme");
      const dark = state.theme === "dark" || (!state.theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
      $("themeIcon").innerHTML = dark
        ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
        : '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/>';
    }
    function toggleTheme() {
      const dark = state.theme === "dark" || (!state.theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
      state.theme = dark ? "light" : "dark";
      save(); applyTheme(); renderDonut(); renderTrend();
    }

    // ---------- Events ----------
    $("addTaskBtn").addEventListener("click", addTask);
    $("taskInput").addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });

    $("taskList").addEventListener("click", e => {
      const chk = e.target.closest("[data-check]");
      if (chk) { toggleTask(chk.getAttribute("data-check")); return; }
      const del = e.target.closest(".task-del");
      if (del) { deleteTask(del.getAttribute("data-id")); return; }
    });

    $("projectList").addEventListener("click", e => {
      const del = e.target.closest(".proj-del");
      if (del) { e.stopPropagation(); deleteProject(del.getAttribute("data-id")); return; }
      const proj = e.target.closest(".proj");
      if (proj) openProjectModal(proj.getAttribute("data-id"));
    });

    $("addProjectBtn").addEventListener("click", () => openProjectModal(null));
    $("projectCancel").addEventListener("click", closeProjectModal);
    $("projectSave").addEventListener("click", saveProject);
    $("projectNameInput").addEventListener("keydown", e => { if (e.key === "Enter") saveProject(); });
    $("projectModal").addEventListener("click", e => { if (e.target === $("projectModal")) closeProjectModal(); });
    $("colorSwatches").addEventListener("click", e => {
      const b = e.target.closest("button[data-c]");
      if (!b) return;
      pickedColor = b.getAttribute("data-c");
      [...$("colorSwatches").children].forEach(c => c.classList.toggle("sel", c === b));
    });

    $("notes").addEventListener("input", onNoteInput);
    $("themeBtn").addEventListener("click", toggleTheme);
    $("notifyBtn").addEventListener("click", requestNotify);
    $("exportBtn").addEventListener("click", exportData);
    $("importBtn").addEventListener("click", () => $("importFile").click());
    $("importFile").addEventListener("change", e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ""; });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeProjectModal(); });

    // ---------- Init ----------
    applyTheme();
    $("notes").value = state.notes || "";
    renderAiLinks();
    renderAll();
    tickClock();
    setInterval(tickClock, 1000 * 20);
    setInterval(() => { renderTasks(); renderStats(); }, 60000); // refresh overdue states
    checkReminders();
    setInterval(checkReminders, 30000);
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!state.theme) { applyTheme(); renderDonut(); renderTrend(); } });
  })();
  </script>
</body>
</html>
